project_name: "Optikos"
icon: "component"
cli_path: "optikos"
cli_description: "Optikos dev tools"
commands:
  - name: "Dev server"
    type: "command"
    description: "Serves sandboxes and demos with automatic rebuild"
    icon: "play"
    folder: "Dev"
    command: "npm run dev"
    is_background: true
    open_last_link: true
    cli_path: "dev"
  - name: "Open sandbox"
    type: "command"
    description: "Serves one sandbox category"
    icon: "flask-conical"
    folder: "Sandbox"
    command: "npm run sandbox -- {{CATEGORY}}"
    is_background: true
    open_last_link: true
    cli_path: "open"
    params:
      - name: "CATEGORY"
        label: "Category"
        type: "select"
        options_script: "ls sandbox"
        required: true
  - name: "Run demo"
    type: "command"
    description: "Serves one demo app"
    icon: "rocket"
    folder: "Demos"
    command: "npm run demo -- {{DEMO}}"
    is_background: true
    open_last_link: true
    cli_path: "run"
    params:
      - name: "DEMO"
        label: "Demo"
        type: "select"
        options_script: "ls demos"
        required: true
  - name: "Build"
    type: "command"
    description: "Builds dist/ and prints the gzip size report"
    icon: "hammer"
    folder: "Build"
    command: "npm run build"
    cli_path: "build"
  - name: "Test"
    type: "command"
    icon: "flask-conical"
    folder: "Tests"
    command: "npm test"
    cli_path: "test"
  - name: "Typecheck"
    type: "command"
    icon: "circle-check"
    folder: "Tests"
    command: "npm run typecheck"
    cli_path: "typecheck"
  - name: "Check"
    type: "command"
    description: "Typecheck + tests + build with size budgets"
    icon: "shield-check"
    folder: "Tests"
    command: "npm run check"
    cli_path: "check"
  - name: "Theme to CSS"
    type: "command"
    description: "Compiles a defineTheme() TypeScript file into a plain CSS file"
    icon: "wand-sparkles"
    folder: "Generate"
    command: "npm run theme -- {{THEME_FILE}} {{OUT_FILE}}"
    cli_path: "theme"
    params:
      - name: "THEME_FILE"
        label: "Theme file (.ts)"
        type: "file"
        required: true
      - name: "OUT_FILE"
        label: "Output CSS file"
        type: "text"
        default: "my-theme.css"
        required: true
  - name: "New component"
    type: "command"
    description: "Generates the spec sheet, .ts, .css, test and sandbox case"
    icon: "file-plus"
    folder: "Generate"
    command: "npm run new:component -- {{CATEGORY}} {{NAME}}"
    cli_path: "new"
    params:
      - name: "CATEGORY"
        label: "Category"
        type: "select"
        options: ["base", "layout", "fields", "form", "data", "overlays", "navigation", "feedback", "dates"]
        default: "base"
        required: true
      - name: "NAME"
        label: "Component name (lowercase)"
        type: "text"
        required: true
  - name: "Release"
    type: "command"
    description: "Check + npm publish. Dry run unless unchecked."
    icon: "package"
    folder: "Release"
    command: "npm run release -- --dry-run={{DRY_RUN}}"
    cli_path: "release"
    params:
      - name: "DRY_RUN"
        label: "Dry run"
        type: "bool"
        default: "true"
  - name: "Docs site"
    type: "command"
    description: "Living documentation: every component with spec sheet and live, editable examples"
    icon: "book-open"
    folder: "Docs"
    command: "npm run site"
    is_background: true
    open_last_link: true
    cli_path: "docs"
  - name: "MCP server"
    type: "command"
    description: "Optikos MCP server over stdio (spec sheets, examples, tokens, themes, guides)"
    icon: "plug"
    folder: "Docs"
    command: "npm run mcp"
    cli_path: "mcp"
  - name: "MCP config"
    type: "command"
    description: "Prints the .mcp.json snippet to register the server in any MCP client"
    icon: "clipboard"
    folder: "Docs"
    command: "cat .mcp.json"
    cli_path: "mcp-config"
folders:
  - path: "Docs"
    icon: "book-open"
    cli_path: "docs"
  - path: "Dev"
    icon: "terminal"
    cli_path: "dev"
  - path: "Sandbox"
    icon: "flask-conical"
    cli_path: "sandbox"
  - path: "Demos"
    icon: "rocket"
    cli_path: "demos"
  - path: "Build"
    icon: "hammer"
  - path: "Tests"
    icon: "list-checks"
  - path: "Generate"
    icon: "sparkles"
  - path: "Release"
    icon: "package"
